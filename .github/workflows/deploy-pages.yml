name: Deploy CIFOR-ICRAF Grant Finder to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Refresh live grants and redeploy daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --python 3.12
          uv pip install shinylive

      - name: Fetch live grant opportunities
        run: |
          uv run python scripts/test_sources.py || echo "Warning: live fetch had partial issues; continuing with cache"

      - name: Export Shinylive static site
        run: |
          uv run python scripts/build_pages.py
          touch _site/.nojekyll
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
